<svg width="800" height="520" xmlns="http://www.w3.org/2000/svg" style="background:#0f172a;border-radius:8px">
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
</pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
</defs>
<rect width="800" height="520" fill="url(#g)"/>

<!-- Client -->
<rect x="100" y="60" width="160" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="180" y="92" fill="#22d3ee" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">Browser</text>
<text x="180" y="108" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">React SPA (PWA)</text>
<text x="180" y="120" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">:3000</text>

<!-- nginx -->
<rect x="400" y="60" width="160" height="70" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480" y="92" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">nginx</text>
<text x="480" y="108" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">Reverse Proxy</text>
<text x="480" y="120" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">Static Files</text>

<!-- Backend -->
<rect x="370" y="240" width="220" height="80" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="480" y="270" fill="#34d399" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">Spring Boot API</text>
<text x="480" y="286" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">REST Controllers + JWT</text>
<text x="480" y="300" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">JPA / Hibernate</text>
<text x="480" y="314" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">:8080</text>

<!-- DB -->
<rect x="400" y="400" width="160" height="70" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="480" y="432" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">PostgreSQL</text>
<text x="480" y="448" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">Menu / Orders</text>
<text x="480" y="460" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">:5432</text>

<!-- Printer -->
<rect x="100" y="240" width="160" height="70" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
<text x="180" y="272" fill="#fb923c" font-size="11" text-anchor="middle" font-family="monospace" font-weight="600">Ticket Printer</text>
<text x="180" y="288" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">WebSocket Client</text>
<text x="180" y="302" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">Order / Receipt</text>

<!-- Arrows -->
<line x1="260" y1="95" x2="400" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="480" y1="130" x2="480" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="480" y1="320" x2="480" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="370" y1="280" x2="260" y2="280" stroke="#fb923c" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="320" y="270" fill="#fb923c" font-size="8" text-anchor="middle" font-family="monospace">WebSocket</text>

<!-- Labels -->
<text x="340" y="140" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">Static Assets</text>
<text x="340" y="210" fill="#64748b" font-size="8" text-anchor="middle" font-family="monospace">HTTP /api/* (JWT)</text>
</svg>