# SonarQube project configuration
sonar.projectKey=table2taste
sonar.projectName=Table2Taste
sonar.projectVersion=1.0.0

# Sources
sonar.sources=packages/backend/src/main/java,packages/frontend/src
sonar.tests=packages/backend/src/test/java,packages/frontend/src

# Language
sonar.language=java,ts

# Java
sonar.java.binaries=packages/backend/target/classes
sonar.java.test.binaries=packages/backend/target/test-classes
sonar.java.libraries=packages/backend/target/dependency/*
sonar.java.source=17

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=packages/frontend/coverage/lcov.info

# Test coverage
sonar.coverage.jacoco.xmlReportPaths=packages/backend/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=packages/frontend/src/**/*.test.tsx,packages/frontend/src/**/*.test.ts,packages/frontend/src/reportWebVitals.ts
sonar.test.exclusions=packages/frontend/src/**/*.test.tsx,packages/frontend/src/**/*.test.ts

# Encoding
sonar.sourceEncoding=UTF-8

# Docker
sonar.docker.filePatterns=Dockerfile*,Dockerfile.*
