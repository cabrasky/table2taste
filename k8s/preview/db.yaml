# ── Preview DB (ephemeral — no PVC for previews) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: table2taste-preview-__SUBDOMAIN__
  labels:
    app: postgres
    type: preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "table-2-taste"
            - name: POSTGRES_PASSWORD
              value: "preview_pass_2024"
            - name: POSTGRES_DB
              value: "table2taste"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - table-2-taste
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - table-2-taste
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: table2taste-preview-__SUBDOMAIN__
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
